<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pari Cab Service — Admin</title><style>
body{font-family:system-ui;background:#0c0d12;color:#f2f1ec;margin:0}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#15171f;border:1px solid #262933;border-radius:14px;padding:20px;margin-bottom:18px}input,select,button{padding:10px;border-radius:8px;border:1px solid #363945;background:#0f1016;color:#fff}button{cursor:pointer;background:#c9a227;color:#171204;font-weight:700}.login{max-width:420px;margin:10vh auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:11px 8px;border-bottom:1px solid #292b35;text-align:left;vertical-align:top}th{color:#e7c765}.muted{color:#9aa0ab}.hidden{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:4px 8px;border:1px solid #444;border-radius:20px}
</style></head><body><main class="wrap"><div id="login" class="card login"><h1>Pari Cab Service Admin</h1><p class="muted">Sign in to manage customer bookings.</p><input id="user" placeholder="Username" autocomplete="username"><br><br><input id="pass" type="password" placeholder="Password" autocomplete="current-password"><br><br><button onclick="login()">Sign in</button><p id="loginMsg"></p></div><div id="app" class="hidden"><div class="actions"><h1 style="margin-right:auto">Bookings</h1><select id="filter" onchange="loadBookings()"><option>All</option><option>New</option><option>Confirmed</option><option>Completed</option><option>Cancelled</option></select><button onclick="logout()">Logout</button></div><div class="card"><div class="actions"><span id="count" class="pill">0 bookings</span><button onclick="loadBookings()">Refresh</button></div><div style="overflow:auto"><table><thead><tr><th>Ref</th><th>Customer</th><th>Trip</th><th>Date/Time</th><th>Cab</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></main><script>
let token=localStorage.getItem('pari_admin_token');if(token){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadBookings()}
async function login(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user.value,password:pass.value})});let d=await r.json();if(!r.ok)return loginMsg.textContent=d.error||'Login failed';token=d.token;localStorage.setItem('pari_admin_token',token);location.reload()}
async function loadBookings(){let r=await fetch('/api/admin/bookings?status='+encodeURIComponent(filter.value),{headers:{Authorization:'Bearer '+token}});if(r.status===401)return logout();let d=await r.json();count.textContent=d.length+' booking'+(d.length===1?'':'s');rows.innerHTML=d.map(b=>`<tr><td><b>${esc(b.booking_ref)}</b><br><span class="muted">${esc(b.created_at)}</span></td><td>${esc(b.customer_name)}<br>${esc(b.phone)}</td><td>${esc(b.pickup)} → ${esc(b.dropoff)}<br>${esc(b.notes||'')}</td><td>${esc(b.travel_date||'—')} ${esc(b.travel_time||'')}</td><td>${esc(b.cab_type)}</td><td><span class="pill">${esc(b.status)}</span></td><td><select onchange="setStatus(${b.id},this.value)"><option>New</option><option>Confirmed</option><option>Completed</option><option>Cancelled</option></select></td></tr>`).join('')}
async function setStatus(id,status){await fetch('/api/admin/bookings/'+id,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({status})});loadBookings()}
async function logout(){await fetch('/api/admin/logout',{method:'POST',headers:{Authorization:'Bearer '+token}}).catch(()=>{});localStorage.removeItem('pari_admin_token');location.reload()}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script></body></html>
